<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShoeBox|Home</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script
      src="https://kit.fontawesome.com/84ff9154d2.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body class="bg-gradient-to-br from-gray-800 to-black min-h-screen">
    <!--NAVIGATION BAR-->
    <div>
      <nav
        class="w-full flex justify-center flex-wrap gap-2 px-4 pt-12 pb-4 text-white text-[10px] sm:text-xs font-semibold tracking-widest uppercase"
      >
        <a
          href="index.html"
          class="px-3 py-2 bg-white/10 backdrop-blur-md border border-white/20 shadow-lg rounded-full hover:bg-white/20"
          >Home</a
        >
        <a
          href="men.html"
          class="px-3 py-2 bg-white/10 backdrop-blur-md border border-white/20 shadow-lg rounded-full hover:bg-white/20"
          >men</a
        >
        <a
          href="women.html"
          class="px-3 py-2 bg-white/10 backdrop-blur-md border border-white/20 shadow-lg rounded-full hover:bg-white/20"
          >women</a
        >
        <a
          href="kids.html"
          class="px-3 py-2 bg-white/10 backdrop-blur-md border border-white/20 shadow-lg rounded-full hover:bg-white/20"
          >kids</a
        >
        <a
          href="collection.html"
          class="px-3 py-2 bg-white/10 backdrop-blur-md border border-white/20 shadow-lg rounded-full hover:bg-white/20"
          >collection</a
        >
      </nav>
    </div>
    <!--LOGO-->
    <div
      class="mt-10 bg-white/10 backdrop-blur-md border border-white/20 rounded-[40px] p-6 shadow-lg flex justify-center items-center w-full max-w-2xl mx-auto"
    >
      <img
        src="assets/images/logo.png"
        alt="ShoeBox logo"
        class="w-full h-auto object-contain drop-shadow-md rounded-2xl"
      />
    </div>
    <div class="w-full flex justify-center mt-7 pr-2">
      <button
        class="px-3 py-2 bg-white/10 backdrop-blur-md border border-white/20 shadow-lg rounded-full hover:bg-white/20 text-white font-semibold uppercase"
      >
        <a href="shop.html">Shop Now</a>
      </button>
    </div>
    <footer
      class="mt-16 bg-white/10 backdrop-blur-md border-t border-white/20 text-white px-6 py-10 rounded-t-[40px]"
    >
      <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-10">

        <!-- ABOUT -->

        <div>
          <h2 class="text-3xl font-bold mb-4">ShoeBox</h2>

          <p class="text-gray-300 text-sm leading-6">
            Premium quality sneakers for every style. Step into comfort,
            confidence, and streetwear fashion.
          </p>
        </div>

        <!-- CONTACTS -->

        <div>
          <h3 class="text-xl font-semibold mb-5">Contacts</h3>

          <!-- PHONE -->

          <div class="flex items-center gap-3 mb-4 text-gray-300">
            <i class="fa-solid fa-phone"></i>

            <p>+254 702 334 410</p>
          </div>

          <!-- EMAIL -->

          <div class="flex items-center gap-3 mb-4 text-gray-300">
            <i class="fa-solid fa-envelope"></i>

            <p>shoebox@gmail.com</p>
          </div>

          <!-- WHATSAPP -->

          <div class="flex items-center gap-3 text-gray-300">
            <i class="fa-brands fa-whatsapp"></i>

            <p>+254 702 334 410</p>
          </div>
        </div>

        <!-- LOCATION + SOCIALS -->

        <div>
          <h3 class="text-xl font-semibold mb-5">Location</h3>

          <div class="flex items-center gap-3 text-gray-300 mb-8">
            <i class="fa-solid fa-location-dot"></i>

            <p>Embakisi Imara-daima, Nairobi, Kenya</p>
          </div>

          <!-- SOCIAL MEDIA -->

          <h3 class="text-xl font-semibold mb-5">Follow Us</h3>

          <div class="flex gap-4">
            <!-- INSTAGRAM -->

            <a
              href="https://www.instagram.com/s.hoebox?igsh=MXZ6ejdsbjNlZHo2aw=="
              target="_blank"
              class="w-12 h-12 flex items-center justify-center rounded-full bg-white/10 hover:bg-pink-500 transition-all text-xl"
            >
              <i class="fa-brands fa-instagram"></i>
            </a>

            <!-- TIKTOK -->

            <a
              href="https://www.tiktok.com/@s.ho3box?_r=1&_t=ZS-96bQ7eHAlin"
              target="_blank"
              class="w-12 h-12 flex items-center justify-center rounded-full bg-white/10 hover:bg-white/20 transition-all text-xl"
            >
              <i class="fa-brands fa-tiktok"></i>
            </a>
          </div>
        </div>
      </div>

      <!-- FOOTER BOTTOM -->

      <div
        class="border-t border-white/10 mt-10 pt-6 text-center text-gray-400 text-sm"
      >
        <p>&copy;2026 ShoeBox. All rights reserved.</p>
      </div>
    </footer>

</html>
