<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Receipt | ShoeBox</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Font Awesome -->
    <script
        src="https://kit.fontawesome.com/84ff9154d2.js"
        crossorigin="anonymous"
    ></script>
</head>

<body class="bg-gradient-to-br from-gray-800 to-black min-h-screen text-white">

    <!-- STAR FIELD BACKGROUND -->

    <div
      class="fixed inset-0 pointer-events-none overflow-hidden select-none -z-10"
    >
      <!-- SMALL STARS -->

      <div
        class="absolute top-8 left-8 w-1 h-1 bg-white rounded-full opacity-70"
      ></div>

      <div
        class="absolute top-20 right-28 w-0.5 h-0.5 bg-white rounded-full opacity-60"
      ></div>

      <div
        class="absolute top-44 left-20 w-1 h-1 bg-white rounded-full opacity-80"
      ></div>

      <div
        class="absolute top-52 right-12 w-0.5 h-0.5 bg-white rounded-full opacity-70"
      ></div>

      <div
        class="absolute top-72 left-36 w-1 h-1 bg-white rounded-full opacity-70"
      ></div>

      <div
        class="absolute top-96 right-36 w-0.5 h-0.5 bg-white rounded-full opacity-60"
      ></div>

      <div
        class="absolute top-[400px] left-10 w-1 h-1 bg-white rounded-full opacity-80"
      ></div>

      <div
        class="absolute top-[420px] right-16 w-0.5 h-0.5 bg-white rounded-full opacity-50"
      ></div>

      <div
        class="absolute top-[480px] left-28 w-1 h-1 bg-white rounded-full opacity-75"
      ></div>

      <div
        class="absolute top-[530px] right-32 w-1 h-1 bg-white rounded-full opacity-80"
      ></div>

      <div
        class="absolute top-[590px] left-16 w-0.5 h-0.5 bg-white rounded-full opacity-60"
      ></div>

      <div
        class="absolute bottom-12 left-24 w-1 h-1 bg-white rounded-full opacity-75"
      ></div>

      <div
        class="absolute bottom-24 right-14 w-1 h-1 bg-white rounded-full opacity-80"
      ></div>

      <div
        class="absolute bottom-40 left-12 w-0.5 h-0.5 bg-white rounded-full opacity-60"
      ></div>

      <div
        class="absolute bottom-56 right-24 w-1 h-1 bg-white rounded-full opacity-70"
      ></div>

      <div
        class="absolute bottom-72 left-32 w-0.5 h-0.5 bg-white rounded-full opacity-80"
      ></div>

      <!-- GLOWING STARS -->

      <div
        class="absolute top-16 right-10 w-1.5 h-1.5 bg-white rounded-full opacity-90 shadow-[0_0_8px_2px_rgba(255,255,255,0.7)]"
      ></div>

      <div
        class="absolute top-32 left-14 w-1.5 h-1.5 bg-white rounded-full opacity-90 shadow-[0_0_8px_2px_rgba(255,255,255,0.7)]"
      ></div>

      <div
        class="absolute top-80 right-20 w-1.5 h-1.5 bg-white rounded-full opacity-90 shadow-[0_0_8px_2px_rgba(255,255,255,0.7)]"
      ></div>

      <div
        class="absolute top-[460px] right-8 w-1.5 h-1.5 bg-white rounded-full opacity-95 shadow-[0_0_8px_2px_rgba(255,255,255,0.7)]"
      ></div>

      <div
        class="absolute bottom-32 left-8 w-1.5 h-1.5 bg-white rounded-full opacity-90 shadow-[0_0_8px_2px_rgba(255,255,255,0.7)]"
      ></div>

      <div
        class="absolute bottom-64 right-12 w-1.5 h-1.5 bg-white rounded-full opacity-95 shadow-[0_0_8px_2px_rgba(255,255,255,0.7)]"
      ></div>

      <!-- PULSING STARS -->

      <div
        class="absolute top-24 left-44 w-1.5 h-1.5 bg-white rounded-full opacity-100 animate-pulse shadow-[0_0_10px_3px_rgba(255,255,255,0.8)]"
      ></div>

      <div
        class="absolute top-[350px] left-24 w-1 h-1 bg-white rounded-full opacity-90 animate-pulse shadow-[0_0_6px_2px_rgba(255,255,255,0.5)]"
      ></div>

      <div
        class="absolute bottom-16 left-40 w-1.5 h-1.5 bg-white rounded-full opacity-100 animate-pulse shadow-[0_0_10px_3px_rgba(255,255,255,0.8)]"
      ></div>

      <div
        class="absolute bottom-48 right-28 w-1 h-1 bg-white rounded-full opacity-90 animate-pulse shadow-[0_0_6px_2px_rgba(255,255,255,0.5)]"
      ></div>
    </div>

    <!-- RECEIPT CONTAINER -->
    <div class="max-w-4xl mx-auto p-6">

        <!-- HEADER -->
        <div
            class="bg-white/10 backdrop-blur-md border border-white/20 rounded-3xl p-8 shadow-xl"
        >

            <div class="text-center mb-8">

                <i
                    class="fa-solid fa-circle-check text-green-400 text-6xl mb-4"
                ></i>

                <h1 class="text-5xl font-bold">
                    Order Successful
                </h1>

                <p class="text-gray-300 mt-3">
                    Thank you for shopping with ShoeBox
                </p>

            </div>

            <!-- ORDER INFO -->
            <div
                id="orderInfo"
                class="grid md:grid-cols-2 gap-6 mb-8"
            >
            </div>

            <!-- PRODUCTS -->
            <div>

                <h2
                    class="text-2xl font-bold border-b border-white/20 pb-3 mb-4"
                >
                    Purchased Items
                </h2>

                <div
                    id="receiptItems"
                    class="space-y-4"
                >
                </div>

            </div>

            <!-- TOTALS -->
            <div
                class="border-t border-white/20 mt-8 pt-6 space-y-3"
            >

                <div
                    class="flex justify-between"
                >
                    <span>Subtotal</span>

                    <span
                        id="receiptSubtotal"
                    >
                        Ksh 0
                    </span>
                </div>

                <div
                    class="flex justify-between"
                >
                    <span>Delivery Fee</span>

                    <span
                        id="receiptDelivery"
                    >
                        Ksh 0
                    </span>
                </div>

                <div
                    class="flex justify-between text-2xl font-bold text-green-400"
                >
                    <span>Total Paid</span>

                    <span
                        id="receiptTotal"
                    >
                        Ksh 0
                    </span>
                </div>

            </div>

            <!-- ACTION BUTTONS -->
            <div
                class="flex flex-col md:flex-row gap-4 mt-10"
            >

                <button
                    onclick="window.print()"
                    class="flex-1 bg-blue-500 hover:bg-blue-600 py-3 rounded-xl font-bold transition"
                >
                    <i class="fa-solid fa-print mr-2"></i>
                    Print Receipt
                </button>

                <a
                    href="index.html"
                    class="flex-1 text-center bg-green-500 hover:bg-green-600 py-3 rounded-xl font-bold transition"
                >
                    <i class="fa-solid fa-house mr-2"></i>
                    Continue Shopping
                </a>

            </div>

        </div>

    </div>

    <script src="receipt.js"></script>

</body>
</html>
