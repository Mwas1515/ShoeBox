<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart|Drawer</title>
        <!-- Tailwind CSS -->
   
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <!-- Font Awesome -->
   
    <script
      src="https://kit.fontawesome.com/84ff9154d2.js"
      crossorigin="anonymous"
    ></script>
</head>
<body>
    <!-- CART DRAWER -->
<div
    id="cartDrawer"
    class="fixed top-0 left-0 w-full min-h-[400px] bg-black/95 backdrop-blur-md border-b border-white/20 shadow-2xl transform -translate-y-full transition-transform duration-500 ease-in-out z-[9998]"
>
    <div class="max-w-5xl mx-auto p-6">

        <!-- HEADER -->
        <div class="flex justify-between items-center border-b border-white/20 pb-4">
            <h2 class="text-white text-3xl font-bold tracking-wider uppercase">
                Shopping Cart
            </h2>

            <button
                id="closeCartBtn"
                class="text-white text-3xl font-bold hover:text-red-500 transition"
            >
                &times;
            </button>
        </div>

        <!-- CART ITEMS -->
        <div
            id="cartItems"
            class="mt-6 space-y-4 max-h-[400px] overflow-y-auto"
        >
            <!-- Products will appear here automatically -->
        </div>

        <!-- TOTAL & CHECKOUT -->
        <div class="mt-6 border-t border-white/20 pt-6">

            <div class="flex justify-between items-center mb-6">
                <h3 class="text-white text-2xl font-bold">
                    Total:
                </h3>

                <span
                    id="cartTotal"
                    class="text-green-400 text-2xl font-bold"
                >
                    Ksh 0
                </span>
            </div>

            <button
                id="checkoutBtn"
                class="w-full bg-green-500 hover:bg-green-600 text-white py-4 rounded-2xl font-bold text-lg uppercase tracking-wider transition-all duration-300"
            >
                Proceed To Checkout
            </button>

        </div>
    </div>
</div>
<script src="products.js"></script>
<script src="shoppingCart.js"></script>
</body>
</html>
