<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
        <!-- Tailwind CSS -->

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body>
<body class="bg-gradient-to-br from-gray-800 to-black min-h-screen text-white">

    <div class="max-w-5xl mx-auto p-8">

        <h1 class="text-5xl font-bold text-center mb-10">
            Shopping Cart
        </h1>

        <div
            id="cartItems"
            class="space-y-4"
        >
        </div>

        <div
            class="mt-8 border-t border-white/20 pt-6 flex justify-between items-center"
        >
            <h2
                id="cartTotal"
                class="text-3xl font-bold"
            >
                Total: Ksh 0
            </h2>

            <button
                id="checkoutBtn"
                class="bg-green-500 hover:bg-green-600 px-8 py-3 rounded-xl font-bold"
            >
                Checkout
            </button>
        </div>

        <div class="mb-8">
    <a
        href="index.html"
        class="inline-flex items-center gap-2 bg-white/10 backdrop-blur-md border border-white/20 text-white px-6 py-3 rounded-full font-semibold shadow-lg hover:bg-white/20 transition-all duration-300"
    >
        <i class="fa-solid fa-arrow-left"></i>
        <span>Back to Shop</span>
    </a>
</div>

    </div>

    <script src="shoppingCart.js"></script>

</body>

</body>
</html>
