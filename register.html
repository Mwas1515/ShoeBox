<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gradient-to-br from-gray-800 to-black min-h-screen flex items-center justify-center">

    <!-- Background -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden select-none -z-10">
        <div class="absolute top-24 left-44 w-1.5 h-1.5 bg-white rounded-full animate-pulse"></div>
        <div class="absolute top-80 right-20 w-1.5 h-1.5 bg-white rounded-full animate-pulse"></div>
        <div class="absolute bottom-16 left-40 w-1.5 h-1.5 bg-white rounded-full animate-pulse"></div>
        <div class="absolute bottom-48 right-28 w-1 h-1 bg-white rounded-full animate-pulse"></div>
    </div>

    <!-- Card -->
    <div class="bg-white/10 backdrop-blur-md border border-white/20 rounded-[40px] p-10 shadow-lg w-full max-w-md">

        <div class="text-center">

            <h1 class="text-white text-5xl font-bold tracking-widest uppercase">
                ShoeBox
            </h1>

            <h2 class="text-white text-2xl font-semibold mt-8 mb-6">
                Create Account
            </h2>

            <form id="registerForm" class="flex flex-col gap-4">

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Enter Email"
                    required
                    class="bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-white placeholder-gray-300 outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-400/30 transition"
                >

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Create Password"
                    required
                    class="bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-white placeholder-gray-300 outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-400/30 transition"
                >

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm Password"
                    required
                    class="bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-white placeholder-gray-300 outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-400/30 transition"
                >
                <div class="flex items-center gap-2 text-white text-sm">
                   <input type="checkbox" id="showPassword">
                   <label for="showPassword">Show Passwords</label>
                   </div>

                <button
                    type="submit"
                    class="bg-white text-black font-semibold py-3 rounded-xl hover:bg-gray-200 transition duration-300 cursor-pointer"
                >
                    Create Account
                </button>

            </form>

            <p id="message" class="mt-4 text-white"></p>

            <p class="text-gray-300 text-sm mt-6">
                Already have an account?
                <a
                    href="user.html"
                    class="text-blue-400 hover:text-blue-300 font-semibold"
                >
                    Login
                </a>
            </p>

        </div>

    </div>

    <script src="register.js"></script>

</body>
</html>
